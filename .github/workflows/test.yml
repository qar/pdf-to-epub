name: Validate Conversion Core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Conversion Tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf
      - name: Install EPUBCheck
        run: |
          curl -fL --retry 3 --max-time 180 https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip -o "$RUNNER_TEMP/epubcheck.zip"
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          echo "EPUBCHECK_JAR=$RUNNER_TEMP/epubcheck-5.4.0/epubcheck.jar" >> "$GITHUB_ENV"
      - name: Install Package
        run: python -m pip install -e '.[dev]'
      - name: Check Code
        run: |
          ruff check skills/pdf-to-epub/scripts tests
          ruff format --check skills/pdf-to-epub/scripts tests
      - name: Test and Validate EPUB
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
      - name: Build Distribution
        run: python -m build
