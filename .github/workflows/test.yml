name: Validate Conversion Core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Conversion Tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf
      - name: Install EPUBCheck
        run: |
          curl -fL --retry 3 --max-time 180 https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip -o "$RUNNER_TEMP/epubcheck.zip"
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          echo "EPUBCHECK_JAR=$RUNNER_TEMP/epubcheck-5.4.0/epubcheck.jar" >> "$GITHUB_ENV"
      - name: Install Package
        run: python -m pip install -e '.[dev]'
      - name: Check Code
        run: |
          ruff check skills/pdf-to-epub/scripts tests
          ruff format --check skills/pdf-to-epub/scripts tests
      - name: Test and Validate EPUB
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
      - name: Build Distribution
        run: python -m build
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check Web Workspace
        working-directory: web
        run: |
          npm ci
          npm run format:check
          npm test
          npm run build
          npx playwright install --with-deps chromium
      - name: Verify Browser Workflow
        run: |
          npm --prefix web run preview -- --port 5178 --strictPort > "$RUNNER_TEMP/web-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:5178/
          npm --prefix web run smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: .work/browser
